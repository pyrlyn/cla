# Configuration for pyrlyn/ci's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/ci). The action's build and tests stay in ci.yml (npm); this file turns on the scans.
version: 1

# Docs-only pull requests (pyrlyn/ci docs/config.md, "Docs-only changes"): when every changed
# file is documentation (PLAN.md, docs/, AGENTS.md, ...), infra's scans are skipped and the gate
# counts them as passed; ci.yml's `config` job reads the same verdict and skips the npm job.
# README.md (the action's documentation on the Marketplace) and CHANGELOG.md (read by releases)
# run the full CI through pyrlyn/ci's default `base-exclude`; so does anything under src/, tests/
# or dist/.
docs-only:
  enabled: true
  exclude:
    - '^(src|tests|dist)/'

codeql:
  # The workflows and the TypeScript action (`build-mode: none`).
  languages: [actions, javascript-typescript]

# SonarCloud and Snyk stay off (pyrlyn/ci's defaults). SonarCloud needs a project for
# pyrlyn/cla and SONAR_TOKEN first; `sonarcloud: {enabled: true}` then turns it on.

# No .NET project here: the dotnet job would only pass as a no-op.
dotnet:
  enabled: false
