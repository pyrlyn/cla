name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when every changed file
  # is documentation (fails open: "false" when unsure, e.g. a .github/ change).
  config:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@main

  # Skipped on a docs-only pull request (a skipped job counts as passed); a failed `config`
  # runs it.
  ci:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
