name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      # Every release is a dev build, published as a prerelease: this repository's decision.
      # --notes is prepended to the generated notes.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --prerelease \
            --title "${GITHUB_REF_NAME} (dev build)" \
            --notes "$(printf '%s\n%s' '> [!WARNING]' '> Dev build: a development snapshot, published as a prerelease.')"
